name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
            socket-server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix client --ignore-scripts
      - run: npm ci --prefix server --ignore-scripts
      - run: npm ci --prefix socket-server --ignore-scripts
      - run: npm run check:server
      - run: npm run test:server
      - run: npm test --prefix client -- --run
      - run: npm run build
