name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
            socket-server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix client --ignore-scripts
      - run: npm ci --prefix server --ignore-scripts
      - run: npm ci --prefix socket-server --ignore-scripts
      - name: Non-mutating staging configuration preflight (not live evidence)
        run: npm run verify:preflight
      - run: npm run check:server
      - run: npm run test:server
      - run: npm test --prefix client -- --run
      - run: npm run build
      - run: npm run check:client-secrets
